name: tiiny-router
version: 2.0.0
description: "Delegation backend that routes each subtask to the Tiiny model matching its shape: research, index, code, browser, draft, general. Reads the device's resident set and the batch plan written by the lifecycle controller, so a specialist that was just loaded is the specialist the child gets. Never routes to a model that is not loaded, and never loads one itself."
author: Gary Garcia (garciacionet-alt), Hermes Agent
kind: backend
